<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyRemoveBG - Remove Image Background</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#202124;background:#fff}
header{height:76px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 7%}
.logo{font-size:25px;font-weight:800;color:#222}
.logo span{color:#4777f5}
nav{display:flex;gap:28px;align-items:center;color:#444;font-size:14px}
main{text-align:center;padding:90px 20px 50px}
h1{font-size:48px;margin:0 0 15px;letter-spacing:-1.5px}
.subtitle{font-size:19px;color:#666;margin-bottom:42px}
.upload{max-width:650px;min-height:290px;margin:auto;background:#f5f7ff;border:2px dashed #9aaef5;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;cursor:pointer}
.upload:hover{background:#edf1ff}
.upload-icon{font-size:55px;margin-bottom:15px}
.upload strong{font-size:21px;margin-bottom:12px}
.upload p{color:#777;font-size:14px}
button{border:0;border-radius:9px;background:#426cf5;color:white;padding:15px 28px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#3158d8}
#preview{display:none;max-width:650px;margin:30px auto}
#preview img{max-width:100%;max-height:350px;border-radius:12px}
footer{text-align:center;color:#999;padding:40px;font-size:13px}
@media(max-width:600px){h1{font-size:34px}nav{gap:10px;font-size:12px}header{padding:0 4%}}
</style>
</head>
<body>
<header>
<div class="logo">My<span>RemoveBG</span></div>

</header>
<main>
<h1>Remove Image Background</h1>
<div class="subtitle">Remove backgrounds from images automatically with AI.</div>
<div style="max-width:650px;margin:0 auto 18px;text-align:left">
<label for="provider" style="display:block;font-weight:bold;margin-bottom:8px">AI engine</label>
<select id="provider" style="width:100%;padding:13px;border:1px solid #d7dce8;border-radius:9px;background:white;font-size:15px">
<option value="local">MyRemoveBG AI · Local models</option>
<option value="removebg">remove.bg API · Preview quality</option>
<option value="clipdrop">Clipdrop API</option>
</select>
<p id="providerInfo" style="color:#777;font-size:12px;margin:7px 0 0">Your image is processed by the selected engine.</p>
</div>
<label class="upload" for="file">
<div class="upload-icon">☁</div>
<strong>Upload an image</strong>
<button type="button" onclick="document.getElementById('file').click()">Choose a photo</button>
<p>or drop an image here · PNG, JPG, WEBP</p>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</label>
<div id="preview">
<h3>Image preview</h3>
<img id="image" alt="Image preview">
<div style="margin-top:20px">
<button type="button" id="removeBtn">Remove Background</button>
</div>
<div id="result" style="display:none;margin-top:25px">
<h3>Background removed!</h3>
<img id="resultImage" alt="Background removed">
<br>
<a id="download" download="background-removed.png"
style="display:inline-block;margin-top:15px;color:#426cf5;font-weight:bold">
Download PNG
</a>
</div>
<p id="status"></p>
</div>
</main>
<footer>MyRemoveBG · Independent background removal project</footer>
<script>
const file = document.getElementById('file');
const preview = document.getElementById('preview');
const image = document.getElementById('image');
const button = document.getElementById('removeBtn');
const status = document.getElementById('status');
const providerSelect = document.getElementById('provider');
const providerInfo = document.getElementById('providerInfo');

async function loadProviders() {
    try {
        const response = await fetch('/api/providers');
        if (!response.ok) return;
        const providers = await response.json();

        for (const option of providerSelect.options) {
            const info = providers[option.value];
            if (!info) continue;
            if (!info.configured) {
                option.disabled = true;
                if (option.value !== 'local') {
                    option.textContent += ' · API key not configured';
                }
            }
        }
    } catch (error) {
        providerInfo.textContent = 'Provider availability could not be checked.';
    }
}

providerSelect.addEventListener('change', () => {
    const descriptions = {
        local: 'Runs on this server using the built-in AI models.',
        removebg: 'Uses remove.bg. Preview output uses a limited free-call allowance.',
        clipdrop: 'Uses Clipdrop credits from the server API key.'
    };
    providerInfo.textContent = descriptions[providerSelect.value] || '';
});

loadProviders();

file.addEventListener('change', () => {
    if (!file.files.length) return;
    image.src = URL.createObjectURL(file.files[0]);
    preview.style.display = 'block';
    document.getElementById('result').style.display = 'none';
    status.textContent = '';
});

button.addEventListener('click', async () => {
    if (!file.files.length) return;

    button.disabled = true;
    button.textContent = 'Removing background...';
    status.textContent = 'AI is processing your image. Please wait.';

    try {
        const data = new FormData();
        data.append('image', file.files[0]);
        data.append('provider', document.getElementById('provider').value);

        const response = await fetch('/api/remove-background', {
            method: 'POST',
            body: data
        });

        if (!response.ok) {
            throw new Error(await response.text() || 'Processing failed');
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        document.getElementById('resultImage').src = url;
        document.getElementById('download').href = url;
        document.getElementById('result').style.display = 'block';
        status.textContent = 'Done!';
    } catch (error) {
        status.textContent = 'Error: ' + error.message;
    } finally {
        button.disabled = false;
        button.textContent = 'Remove Background';
    }
});
</script>
</body>
</html>
